<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuwo Music API</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; color: #333; }
    h1 { color: #ff6b35; }
    .item { padding: 12px 0; border-bottom: 1px solid #eee; }
    .item a { color: #ff6b35; text-decoration: none; font-family: monospace; }
    .item a:hover { text-decoration: underline; }
    .desc { color: #888; font-size: 14px; margin-top: 4px; }
    code { background: #f5f5f5; padding: 2px 6px; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>Kuwo Music API</h1>
  <p>酷我音乐 NodeJS 版 API，所有接口请通过 HTTP 请求调用。</p>
  <h2>可用接口</h2>
  <div id="list"></div>
  <script>
    const apis = [
      { path: '/search', desc: '搜索歌曲 (key, pn, rn)' },
      { path: '/song/url', desc: '获取播放地址 (id, br)' },
      { path: '/song/detail', desc: '获取歌曲详情 (id)' },
      { path: '/lyric', desc: '获取歌词 (id)' },
      { path: '/login/qr/key', desc: '获取登录二维码 key' },
      { path: '/login/qr/check', desc: '检查扫码状态 (key)' },
      { path: '/login/status', desc: '登录状态 (token)' },
      { path: '/user/detail', desc: '用户详情 (uid)' },
      { path: '/top/category', desc: '排行榜分类' },
      { path: '/top/list', desc: '排行榜歌曲 (bangId, pn, rn)' },
    ];
    const list = document.getElementById('list');
    apis.forEach(api => {
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = `<a href="${api.path}">${api.path}</a><div class="desc">${api.desc}</div>`;
      list.appendChild(div);
    });
  </script>
</body>
</html>
