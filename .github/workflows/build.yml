name: Build Release

permissions:
  contents: write

on:
  push:
    tags:
      - v*

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: ""
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            suffix: "-arm64"
          - os: windows-latest
            goos: windows
            goarch: amd64
            suffix: ".exe"
          - os: macos-latest
            goos: darwin
            goarch: amd64
            suffix: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -o kuwoapi${{ matrix.suffix }} .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuwoapi-${{ matrix.goos }}-${{ matrix.goarch }}
          path: kuwoapi*
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: kuwoapi*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
